name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CoffeeShop.slnx
      - name: Build
        run: dotnet build CoffeeShop.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test CoffeeShop.slnx --configuration Release --no-build
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/CoffeeShop.SignalRClient/package-lock.json
      - name: Install SignalR client dependencies
        run: npm ci --prefix src/CoffeeShop.SignalRClient
      - name: Build SignalR client
        run: npm run build --prefix src/CoffeeShop.SignalRClient
      - name: Build container images
        run: docker compose --profile demo --profile identity --profile observability --profile dapr build
      - name: Run Redis-enabled Phase 1 smoke test
        run: |
          trap 'docker compose --profile demo --profile identity down --volumes --remove-orphans' EXIT
          docker compose up -d postgres redis kafka schema-registry api barista-worker kitchen-worker signalr-client
          ./scripts/phase-1-smoke.sh
          ./scripts/phase-2-smoke.sh
      - name: Run identity smoke test
        run: |
          trap 'docker compose --profile identity down --volumes --remove-orphans' EXIT
          jq --version
          ./tests/scripts/phase-2-identity-smoke-tests.sh
          AUTHENTICATION_ENABLED=true docker compose --profile identity up -d postgres redis kafka schema-registry keycloak api barista-worker kitchen-worker
          ./scripts/phase-2-identity-smoke.sh
      - name: Run one DataGen order
        run: |
          trap 'docker compose --profile demo down --volumes --remove-orphans' EXIT
          docker compose up -d postgres redis kafka schema-registry api barista-worker kitchen-worker
          DATAGEN_ORDER_COUNT=1 docker compose --profile demo run --rm datagen
      - name: Run distributed batch and worker recovery proofs
        run: |
          trap 'docker compose down --volumes --remove-orphans' EXIT
          ./tests/scripts/phase-4-smoke-tests.sh
          docker compose up -d postgres redis kafka schema-registry api barista-worker kitchen-worker
          ./scripts/phase-4-smoke.sh
          ./scripts/phase-4-fault-demo.sh barista-worker
          ./scripts/phase-4-fault-demo.sh kitchen-worker
      - name: Run OpenTelemetry Phase 3 smoke test
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
          OTEL_METRIC_EXPORT_INTERVAL: 5000
        run: |
          trap 'docker compose --profile observability down --volumes --remove-orphans' EXIT
          ./tests/scripts/phase-3-smoke-tests.sh
          ./tests/scripts/phase-4-barista-smoke-tests.sh
          ./tests/scripts/phase-4-compose-tests.sh
          ./tests/scripts/phase-4-kitchen-smoke-tests.sh
          docker compose --profile observability up -d postgres redis kafka schema-registry jaeger otel-collector api barista-worker kitchen-worker
          OTEL_METRICS_URL=http://localhost:9464/metrics JAEGER_URL=http://localhost:16686 ./scripts/phase-4-kitchen-smoke.sh
      - name: Run Dapr Phase 3 smoke test
        env:
          COMPOSE_FILE: compose.yaml:compose.dapr.yaml
          MESSAGING_ADAPTER: Dapr
          BARISTA_HOSTING_MODE: Embedded
          KITCHEN_HOSTING_MODE: Embedded
        run: |
          trap 'docker compose --profile dapr down --volumes --remove-orphans' EXIT
          docker compose --profile dapr up -d postgres redis kafka api dapr-sidecar
          ./scripts/phase-3-smoke.sh
