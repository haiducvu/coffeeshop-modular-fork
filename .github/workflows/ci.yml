name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CoffeeShop.slnx
      - name: Build
        run: dotnet build CoffeeShop.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test CoffeeShop.slnx --configuration Release --no-build
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/CoffeeShop.SignalRClient/package-lock.json
      - name: Install SignalR client dependencies
        run: npm ci --prefix src/CoffeeShop.SignalRClient
      - name: Build SignalR client
        run: npm run build --prefix src/CoffeeShop.SignalRClient
      - name: Build container images
        run: docker compose --profile demo --profile identity build
      - name: Run Redis-enabled Phase 1 smoke test
        run: |
          trap 'docker compose --profile demo --profile identity down --volumes --remove-orphans' EXIT
          docker compose up -d postgres redis api signalr-client
          ./scripts/phase-1-smoke.sh
      - name: Run identity smoke test
        run: |
          trap 'docker compose --profile identity down --volumes --remove-orphans' EXIT
          jq --version
          ./tests/scripts/phase-2-identity-smoke-tests.sh
          AUTHENTICATION_ENABLED=true docker compose --profile identity up -d postgres redis keycloak api
          ./scripts/phase-2-identity-smoke.sh
      - name: Run one DataGen order
        run: |
          trap 'docker compose --profile demo down --volumes --remove-orphans' EXIT
          docker compose up -d postgres redis api
          DATAGEN_ORDER_COUNT=1 docker compose --profile demo run --rm datagen
