name: coffeeshop-modular-fork

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffeeshop}
      POSTGRES_USER: ${POSTGRES_USER:-coffeeshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffeeshop-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  api:
    build:
      context: .
      dockerfile: src/CoffeeShop.Api/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__CoffeeShop: Host=postgres;Port=5432;Database=${POSTGRES_DB:-coffeeshop};Username=${POSTGRES_USER:-coffeeshop};Password=${POSTGRES_PASSWORD:-coffeeshop-local}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:-redis:6379}
      ClientOrigin: http://localhost:${CLIENT_PORT:-5173}
      Authentication__Enabled: ${AUTHENTICATION_ENABLED:-false}
      Authentication__Authority: ${AUTHENTICATION_AUTHORITY:-http://keycloak:8080/realms/coffeeshop}
      Authentication__Audience: ${AUTHENTICATION_AUDIENCE:-coffeeshop-api}
      Authentication__RequireHttpsMetadata: ${AUTHENTICATION_REQUIRE_HTTPS_METADATA:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://localhost:8080/health/ready |
          grep -q '"status":"Healthy"'
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  signalr-client:
    build:
      context: .
      dockerfile: src/CoffeeShop.SignalRClient/Dockerfile
      args:
        VITE_HUB_URL: http://localhost:${API_PORT:-8080}/message
    ports:
      - "${CLIENT_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://localhost:8080/"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  datagen:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: src/CoffeeShop.DataGen/Dockerfile
    environment:
      OrderGenerator__ApiBaseUrl: http://api:8080
      OrderGenerator__OrderCount: ${DATAGEN_ORDER_COUNT:-3}
      OrderGenerator__Interval: ${DATAGEN_INTERVAL:-00:00:01}
      OrderGenerator__Seed: ${DATAGEN_SEED:-20260808}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  keycloak:
    profiles: ["identity"]
    image: quay.io/keycloak/keycloak:26.5.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-18080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18080}:8080"
    volumes:
      - ./deploy/keycloak/coffeeshop-realm.json:/opt/keycloak/data/import/coffeeshop-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/coffeeshop/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
