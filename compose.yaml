name: coffeeshop-modular-fork

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffeeshop}
      POSTGRES_USER: ${POSTGRES_USER:-coffeeshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffeeshop-local}
      COUNTER_DB_PASSWORD: ${COUNTER_DB_PASSWORD:-counter-local}
      BARISTA_DB_PASSWORD: ${BARISTA_DB_PASSWORD:-barista-local}
      KITCHEN_DB_PASSWORD: ${KITCHEN_DB_PASSWORD:-kitchen-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-service-databases.sh:/docker-entrypoint-initdb.d/10-service-databases.sh:ro
      - ./deploy/postgres/query-service-database.sh:/opt/coffeeshop/query-service-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092},PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server localhost:19092
          --list >/dev/null 2>&1
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.0
    hostname: schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    ports:
      - "127.0.0.1:${SCHEMA_REGISTRY_PORT:-8081}:8081"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/subjects >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/CoffeeShop.Api/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__CoffeeShop: ${COFFEESHOP_CONNECTION_STRING:-Host=postgres;Port=5432;Database=coffeeshop_counter;Username=coffeeshop_counter;Password=${COUNTER_DB_PASSWORD:-counter-local}}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:-redis:6379}
      ClientOrigin: http://localhost:${CLIENT_PORT:-5173}
      Authentication__Enabled: ${AUTHENTICATION_ENABLED:-false}
      Authentication__Authority: ${AUTHENTICATION_AUTHORITY:-http://keycloak:8080/realms/coffeeshop}
      Authentication__Audience: ${AUTHENTICATION_AUDIENCE:-coffeeshop-api}
      Authentication__RequireHttpsMetadata: ${AUTHENTICATION_REQUIRE_HTTPS_METADATA:-false}
      Messaging__Adapter: ${MESSAGING_ADAPTER:-Kafka}
      Messaging__Dapr__PubSubName: ${DAPR_PUBSUB_NAME:-coffeeshop-pubsub}
      Messaging__Dapr__TopicPrefix: ${DAPR_TOPIC_PREFIX:-coffeeshop}
      Messaging__Dapr__AppApiToken: ${DAPR_APP_API_TOKEN:-coffeeshop-dapr-local-token}
      Messaging__Dapr__SidecarHttpEndpoint: ${DAPR_SIDECAR_HTTP_ENDPOINT:-http://dapr-sidecar:3500}
      Messaging__Dapr__SidecarGrpcEndpoint: ${DAPR_SIDECAR_GRPC_ENDPOINT:-http://dapr-sidecar:50001}
      Messaging__Kafka__Enabled: ${KAFKA_ENABLED:-true}
      Messaging__Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      Messaging__Kafka__SchemaRegistryUrl: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      Messaging__Kafka__ProducerFormat: ${KAFKA_PRODUCER_FORMAT:-Avro}
      Messaging__Kafka__TopicPrefix: ${KAFKA_TOPIC_PREFIX:-coffeeshop}
      Messaging__Kafka__ConsumerGroupPrefix: ${KAFKA_CONSUMER_GROUP_PREFIX:-coffeeshop}
      Messaging__Kafka__Retry__FirstDelay: ${KAFKA_RETRY_FIRST_DELAY:-00:00:01}
      Messaging__Kafka__Retry__SecondDelay: ${KAFKA_RETRY_SECOND_DELAY:-00:00:05}
      Messaging__Kafka__Retry__MaxPollInterval: ${KAFKA_MAX_POLL_INTERVAL:-00:05:00}
      Messaging__CounterOutbox__BatchSize: ${COUNTER_OUTBOX_BATCH_SIZE:-20}
      Messaging__CounterOutbox__PollInterval: ${COUNTER_OUTBOX_POLL_INTERVAL:-00:00:01}
      Messaging__CounterOutbox__LeaseDuration: ${COUNTER_OUTBOX_LEASE_DURATION:-00:00:30}
      Messaging__CounterOutbox__RetryDelay: ${COUNTER_OUTBOX_RETRY_DELAY:-00:00:05}
      Messaging__BaristaOutbox__BatchSize: ${BARISTA_OUTBOX_BATCH_SIZE:-20}
      Messaging__BaristaOutbox__PollInterval: ${BARISTA_OUTBOX_POLL_INTERVAL:-00:00:01}
      Messaging__BaristaOutbox__LeaseDuration: ${BARISTA_OUTBOX_LEASE_DURATION:-00:00:30}
      Messaging__BaristaOutbox__RetryDelay: ${BARISTA_OUTBOX_RETRY_DELAY:-00:00:05}
      Messaging__KitchenOutbox__BatchSize: ${KITCHEN_OUTBOX_BATCH_SIZE:-20}
      Messaging__KitchenOutbox__PollInterval: ${KITCHEN_OUTBOX_POLL_INTERVAL:-00:00:01}
      Messaging__KitchenOutbox__LeaseDuration: ${KITCHEN_OUTBOX_LEASE_DURATION:-00:00:30}
      Messaging__KitchenOutbox__RetryDelay: ${KITCHEN_OUTBOX_RETRY_DELAY:-00:00:05}
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-5000}
      Modules__Barista__Hosting: ${BARISTA_HOSTING_MODE:-External}
      Modules__Kitchen__Hosting: ${KITCHEN_HOSTING_MODE:-External}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://localhost:8080/health/ready |
          grep -q '"status":"Healthy"'
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  barista-worker:
    build:
      context: .
      dockerfile: src/CoffeeShop.Barista.Worker/Dockerfile
    environment:
      ConnectionStrings__Barista: Host=postgres;Port=5432;Database=coffeeshop_barista;Username=coffeeshop_barista;Password=${BARISTA_DB_PASSWORD:-barista-local}
      Messaging__Kafka__Enabled: "true"
      Messaging__Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      Messaging__Kafka__SchemaRegistryUrl: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      Messaging__Kafka__ProducerFormat: ${KAFKA_PRODUCER_FORMAT:-Avro}
      Messaging__Kafka__TopicPrefix: ${KAFKA_TOPIC_PREFIX:-coffeeshop}
      Messaging__Kafka__ConsumerGroupPrefix: ${KAFKA_CONSUMER_GROUP_PREFIX:-coffeeshop}
      Messaging__Kafka__Retry__FirstDelay: ${KAFKA_RETRY_FIRST_DELAY:-00:00:01}
      Messaging__Kafka__Retry__SecondDelay: ${KAFKA_RETRY_SECOND_DELAY:-00:00:05}
      Messaging__Kafka__Retry__MaxPollInterval: ${KAFKA_MAX_POLL_INTERVAL:-00:05:00}
      Messaging__BaristaOutbox__BatchSize: ${BARISTA_OUTBOX_BATCH_SIZE:-20}
      Messaging__BaristaOutbox__PollInterval: ${BARISTA_OUTBOX_POLL_INTERVAL:-00:00:01}
      Messaging__BaristaOutbox__LeaseDuration: ${BARISTA_OUTBOX_LEASE_DURATION:-00:00:30}
      Messaging__BaristaOutbox__RetryDelay: ${BARISTA_OUTBOX_RETRY_DELAY:-00:00:05}
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: "on-failure:3"

  kitchen-worker:
    build:
      context: .
      dockerfile: src/CoffeeShop.Kitchen.Worker/Dockerfile
    environment:
      ConnectionStrings__Kitchen: Host=postgres;Port=5432;Database=coffeeshop_kitchen;Username=coffeeshop_kitchen;Password=${KITCHEN_DB_PASSWORD:-kitchen-local}
      Messaging__Kafka__Enabled: "true"
      Messaging__Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      Messaging__Kafka__SchemaRegistryUrl: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      Messaging__Kafka__ProducerFormat: ${KAFKA_PRODUCER_FORMAT:-Avro}
      Messaging__Kafka__TopicPrefix: ${KAFKA_TOPIC_PREFIX:-coffeeshop}
      Messaging__Kafka__ConsumerGroupPrefix: ${KAFKA_CONSUMER_GROUP_PREFIX:-coffeeshop}
      Messaging__Kafka__Retry__FirstDelay: ${KAFKA_RETRY_FIRST_DELAY:-00:00:01}
      Messaging__Kafka__Retry__SecondDelay: ${KAFKA_RETRY_SECOND_DELAY:-00:00:05}
      Messaging__Kafka__Retry__MaxPollInterval: ${KAFKA_MAX_POLL_INTERVAL:-00:05:00}
      Messaging__KitchenOutbox__BatchSize: ${KITCHEN_OUTBOX_BATCH_SIZE:-20}
      Messaging__KitchenOutbox__PollInterval: ${KITCHEN_OUTBOX_POLL_INTERVAL:-00:00:01}
      Messaging__KitchenOutbox__LeaseDuration: ${KITCHEN_OUTBOX_LEASE_DURATION:-00:00:30}
      Messaging__KitchenOutbox__RetryDelay: ${KITCHEN_OUTBOX_RETRY_DELAY:-00:00:05}
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: "on-failure:3"

  dapr-sidecar:
    profiles: ["dapr"]
    image: daprio/daprd:1.18.3
    environment:
      APP_API_TOKEN: ${DAPR_APP_API_TOKEN:-coffeeshop-dapr-local-token}
    command:
      - ./daprd
      - --app-id
      - coffeeshop-api
      - --app-channel-address
      - api
      - --app-port
      - "8080"
      - --dapr-http-port
      - "3500"
      - --resources-path
      - /components
      - --log-level
      - warn
    ports:
      - "127.0.0.1:${DAPR_HTTP_PORT:-3500}:3500"
    volumes:
      - ./deploy/dapr/components:/components:ro
    depends_on:
      api:
        condition: service_started
      kafka:
        condition: service_healthy

  signalr-client:
    build:
      context: .
      dockerfile: src/CoffeeShop.SignalRClient/Dockerfile
      args:
        VITE_HUB_URL: http://localhost:${API_PORT:-8080}/message
    ports:
      - "${CLIENT_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://localhost:8080/"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  datagen:
    # Finite exploratory generator. Lesson 34's host-side acceptance harness shares
    # DATAGEN_ORDER_COUNT / DATAGEN_SEED but always submits one drink + one food.
    profiles: ["demo"]
    build:
      context: .
      dockerfile: src/CoffeeShop.DataGen/Dockerfile
    environment:
      OrderGenerator__ApiBaseUrl: http://api:8080
      OrderGenerator__OrderCount: ${DATAGEN_ORDER_COUNT:-3}
      OrderGenerator__Interval: ${DATAGEN_INTERVAL:-00:00:01}
      OrderGenerator__Seed: ${DATAGEN_SEED:-20260808}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  keycloak:
    profiles: ["identity"]
    image: quay.io/keycloak/keycloak:26.5.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-18080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18080}:8080"
    volumes:
      - ./deploy/keycloak/coffeeshop-realm.json:/opt/keycloak/data/import/coffeeshop-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/coffeeshop/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.14.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

  otel-collector:
    profiles: ["observability"]
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.149.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_METRICS_PORT:-9464}:9464"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      jaeger:
        condition: service_started

volumes:
  kafka-data:
  postgres-data:
